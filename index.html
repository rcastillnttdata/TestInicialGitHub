<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jabalcón</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="layout">
      <section class="panel">
        <h1>Jabalcón</h1>
        <p>Una aventura para que el presi de los jabalconeros se entretenga un rato.</p>
        <div class="stats">
          <span>Puntuación: <strong id="score">0</strong></span>
          <span>Récord: <strong id="high-score">0</strong></span>
        </div>
        <button id="start-button" type="button">Iniciar partida</button>
        <p id="status">Pulsa el botón para empezar.</p>
        <p class="reference">Referencia del proyecto: <code id="project-reference"></code></p>
      </section>
      <canvas id="game" width="400" height="400" aria-label="Juego Jabalcón">
        Juego de la serpiente Jabalcón. Usa las flechas o WASD para mover la serpiente.
      </canvas>
    </main>
    <script src="./game.js"></script>
  </body>
</html>
